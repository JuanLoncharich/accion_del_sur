# Acción del Sur — sitio Nginx (frontend estático + proxy a la API)
# Instalar en /etc/nginx/sites-available/accion-del-sur y enlazar en sites-enabled.
# Ajustar server_name con el dominio. HTTPS: certbot --nginx (ver docs/despliegue.md).

upstream accion_del_sur_api {
    server 127.0.0.1:3020;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Build de Vite copiado desde frontend/dist (legible por www-data).
    root /var/www/accion-del-sur;
    index index.html;

    # Multer acepta imágenes de hasta 5 MB.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API REST -> backend Node en 127.0.0.1:3020
    location /api/ {
        proxy_pass http://accion_del_sur_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Imágenes subidas (las sirve Express desde backend/uploads)
    location /uploads/ {
        proxy_pass http://accion_del_sur_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Assets con hash en el nombre: cache larga.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header en un location anula los del server: se repiten.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA (React Router): cualquier otra ruta devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
